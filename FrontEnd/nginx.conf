server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ================= API =================
    location /api/ {
        proxy_pass http://itdepartment:8080/api/;
        proxy_set_header Host $host;
    }

    # ================= Files =================
    location /files/ {
        proxy_pass http://itdepartment:8080/files/;
    }

    # ================= SignalR =================
    location /TicketChatHub {
        proxy_pass http://itdepartment:8080/TicketChatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /ProjectChatHub {
        proxy_pass http://itdepartment:8080/ProjectChatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /TaskChatHub {
        proxy_pass http://itdepartment:8080/TaskChatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /UserChatHub {
        proxy_pass http://itdepartment:8080/UserChatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /notificationHub {
        proxy_pass http://itdepartment:8080/notificationHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # ================= Zen =================
    location /zen/ {
        proxy_pass http://zenhrintegrator:8080/;
    }
}