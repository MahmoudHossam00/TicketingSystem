<div class="cp-page">
  <div class="cp-card">
    <div class="cp-brand">
      <img src="images/logo-fpi.png" alt="Logo" class="cp-logo" />
      <h1 class="cp-title">Set a new password</h1>
      <p class="cp-sub">
        Your account requires a password change before you can continue. After saving, sign in again with your new password.
      </p>
    </div>

    <form class="cp-form" (ngSubmit)="submit()">
      <label class="cp-label" for="cp-old">Current password</label>
      <input
        id="cp-old"
        class="cp-input"
        type="password"
        name="oldPassword"
        autocomplete="current-password"
        [(ngModel)]="oldPassword"
        [disabled]="submitting"
      />

      <label class="cp-label" for="cp-new">New password</label>
      <input
        id="cp-new"
        class="cp-input"
        type="password"
        name="newPassword"
        autocomplete="new-password"
        [(ngModel)]="newPassword"
        [disabled]="submitting"
      />

      <label class="cp-label" for="cp-confirm">Confirm new password</label>
      <input
        id="cp-confirm"
        class="cp-input"
        type="password"
        name="confirmPassword"
        autocomplete="new-password"
        [(ngModel)]="confirmPassword"
        [disabled]="submitting"
      />

      <p class="cp-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="cp-submit" [disabled]="submitting">
        {{ submitting ? 'Updating…' : 'Update password' }}
      </button>
    </form>
  </div>
</div>
