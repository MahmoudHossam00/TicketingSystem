services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: it_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd123
    ports:
      - "14333:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd123\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"


  nginx:
    image: nginx:alpine
    container_name: it_nginx
    ports:
      - "8080:80"   # <-- users access backend through this
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - itdepartment
  
  seq:
   image: datalust/seq:latest
   environment:
     - ACCEPT_EULA=Y
     - SEQ_FIRSTRUN_ADMINPASSWORD=YourStrongSeqAdminPass!123
   ports:
     - "5341:80"
   volumes:
     - seq_data:/data

  zenhrintegrator:
    build:
      context: .
      dockerfile: ZenHrIntegrator/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=zenHrData;User Id=sa;Password=1;TrustServerCertificate=True;Encrypt=False
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:80/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # IMPORTANT: match your real config section name
      # If your app uses ZenHrOAuthOptions, use these keys:
      - ZenHrOAuthOptions__Client_Id=""
      - ZenHrOAuthOptions__Client_Secret=""

      # If you also use BasicAuth from appsettings, keep it there (no need to override)
    ports:
      - "8083:8080"
    depends_on:
      mssql:
        condition: service_healthy

  itdepartment:
    build:
      context: .
      dockerfile: ITDepartmentSystem/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=ITSystem;User Id=sa;Password=YourStrong!Passw0rd123;TrustServerCertificate=True;Encrypt=False
      - ConnectionStrings__LogDb=Server=mssql,1433;Database=ITSystem;User Id=sa;Password=YourStrong!Passw0rd123;TrustServerCertificate=True;Encrypt=False
      - ConnectionStrings__Redis=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:80/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - EmployeeDirectory__BaseUrl=http://zenhrintegrator:8080/
      - FrontEnd__BaseUrl=http://localhost:4200

      # Seq (ONLY works if you installed Serilog.Sinks.Seq and added it OR want env override)
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:80

    ports:
      - "8082:8080"
    depends_on:
      - mssql
      - redis
      - seq
      - zenhrintegrator

volumes:
  mssql_data:
  seq_data:
